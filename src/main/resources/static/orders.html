<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders - Distributor Order Management</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header class="navbar">
    <div class="navbar-brand">
        <div class="navbar-brand-icon">DO</div>
        <h2>Distributor Order Management</h2>
    </div>

    <nav class="nav-links" id="navLinks">
        <!-- Rendered dynamically by auth.js -->
    </nav>

    <div class="navbar-user">
        <div class="user-info">
            <div id="usernameDisplay">User</div>
            <div class="user-role" id="roleDisplay">ROLE</div>
        </div>
        <button class="btn btn-secondary btn-small" onclick="logout()">Logout</button>
    </div>
</header>

<main class="container">

    <div class="page-header">
        <div>
            <h1>Order Management</h1>
            <p>Create, track and process business orders.</p>
        </div>
    </div>

    <!-- CREATE ORDER -->
    <div class="card" id="createOrderCard">
        <div class="card-header">
            <div>
                <h2>Create New Order</h2>
                <p>Select retailer and product with quantity.</p>
            </div>
        </div>

        <div id="orderError" class="alert-box" style="display:none;"></div>

        <form onsubmit="event.preventDefault(); createOrder();">
            <div class="form-grid">
                <div class="form-group" id="retailerGroup" style="display:none;">
                    <label for="retailerSelect">Retailer</label>
                    <select id="retailerSelect">
                        <option value="">Loading retailers...</option>
                    </select>
                </div>
                
                <div class="form-group" id="distributorGroup">
                    <label for="distributorSelect">Distributor</label>
                    <select id="distributorSelect" onchange="loadProductsForDistributor()" required>
                        <option value="">Select Distributor...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="productSelect">Product</label>
                    <select id="productSelect" required>
                        <option value="">Loading products...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="quantity">Quantity</label>
                    <input type="number" id="quantity" min="1" value="1" required>
                </div>
            </div>

            <div class="action-group">
                <button type="submit" class="btn btn-primary">Create Order</button>
                <button type="button" class="btn btn-secondary" onclick="loadOrderFormData()">Refresh Products & Retailers</button>
            </div>
        </form>
    </div>

    <!-- ORDERS LIST & FILTER -->
    <div class="card">
        <div class="card-header">
            <div>
                <h2>Orders</h2>
                <p>View and manage existing orders.</p>
            </div>
        </div>

        <div class="search-bar">
            <select id="statusFilter" onchange="loadOrders()">
                <option value="">All Orders</option>
                <option value="PENDING">Pending</option>
                <option value="CONFIRMED">Confirmed</option>
                <option value="PACKED">Packed</option>
                <option value="SHIPPED">Shipped</option>
                <option value="DELIVERED">Delivered</option>
            </select>

            <button class="btn btn-secondary" onclick="loadOrders()">Refresh</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th id="partyHeader">Retailer</th>
                    <th>Date</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="orderTable">
                <tr>
                    <td colspan="6" class="empty-state">Loading orders...</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/orders.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        requireLogin();
        renderNavigation("orders");
        loadOrderFormData();
        loadOrders();
    });
</script>

</body>
</html>
