<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Distributor Order Management - Login</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body class="auth-page">

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-logo">
            DO
        </div>

        <h1>Distributor Order Management</h1>

        <p class="auth-subtitle">
            Business Order & Inventory Platform
        </p>


        <!-- LOGIN -->

        <div id="loginSection">

            <h2>Welcome Back</h2>

            <p class="auth-description">
                Sign in to access your account.
            </p>

            <form onsubmit="event.preventDefault(); login();">

                <div class="form-group">

                    <label for="loginUsername">
                        Username
                    </label>

                    <input
                            type="text"
                            id="loginUsername"
                            placeholder="Enter username"
                            required
                    >

                </div>


                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter password"
                            required
                    >

                </div>


                <button
                        type="submit"
                        class="btn btn-primary btn-full">
                    Sign In
                </button>

            </form>


            <p class="auth-switch">

                Don't have an account?

                <a href="#"
                   onclick="showRegister(); return false;">
                    Create Account
                </a>

            </p>

        </div>


        <!-- REGISTRATION -->

        <div id="registerSection" style="display: none;">
            <h2>Create Account</h2>
            <p class="auth-description">Register for an account.</p>

            <form id="registerForm" onsubmit="event.preventDefault(); register();">
                <div class="form-group">
                    <label for="registerUsername">Username</label>
                    <input type="text" id="registerUsername" placeholder="Choose username" required>
                </div>

                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" placeholder="Minimum 6 characters" minlength="6" required>
                </div>

                <div class="form-group">
                    <label for="registerRole">Account Type</label>
                    <select id="registerRole" onchange="toggleRegistrationFields()" required>
                        <option value="">Select account type</option>
                        
                        <option value="DISTRIBUTOR">Distributor</option>
                        <option value="RETAILER">Retailer</option>
                    </select>
                </div>
                
                <div id="dynamicFields"></div>

                <button type="submit" class="btn btn-primary btn-full">Create Account</button>
            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="#" onclick="showLogin(); return false;">Sign In</a>
            </p>
        </div>


        <div class="auth-footer">

            <p>
                Secure business management platform
            </p>

        </div>

    </div>

</div>


<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>

</body>

</html>
